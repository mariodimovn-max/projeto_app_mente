<!doctype html>
<!-- Story 6.1: página offline servida pelo service worker (public/sw.js).
     Autocontida de propósito (CSS e SVG inline, fontes do sistema): é a única coisa em cache,
     e os assets do Next têm hash de build. Ao alterar este arquivo, incremente CACHE em sw.js. -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080f12" />
    <meta name="color-scheme" content="dark" />
    <title>Sem conexão · Diário Digital</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #080f12;
        color: #eef4f2;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 1rem;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 26rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        text-align: center;
      }
      h1 { font-size: 1.5rem; font-weight: 500; }
      p { color: #b7c7c1; }
      button {
        min-height: 48px;
        padding: 12px 28px;
        border: none;
        border-radius: 999px;
        background: #7fd0c8;
        color: #080f12;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #eef4f2; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
        <defs>
          <radialGradient id="glow">
            <stop offset="0%" stop-color="#7fd0c8" stop-opacity="0.35" />
            <stop offset="55%" stop-color="#7fd0c8" stop-opacity="0.12" />
            <stop offset="70%" stop-color="#7fd0c8" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="core" cx="38%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#b9f0e8" />
            <stop offset="45%" stop-color="#7fd0c8" />
            <stop offset="100%" stop-color="#4ba39c" />
          </radialGradient>
        </defs>
        <circle cx="48" cy="48" r="48" fill="url(#glow)" />
        <circle cx="48" cy="48" r="32" fill="url(#core)" />
      </svg>
      <h1>Sem conexão</h1>
      <p>
        O Diário precisa de internet para conversar com você e guardar suas reflexões.
        Assim que a conexão voltar, é só tentar de novo.
      </p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
