<h2>Redefinir sua senha</h2>

<p>Recebemos um pedido para redefinir a senha da sua conta no Diário Digital.</p>

<p>Para escolher uma nova senha, clique no link abaixo:</p>

<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/auth/redefinir-senha">Redefinir minha senha</a></p>

<p>Se você não pediu isso, pode ignorar este e-mail — sua senha continua a mesma.</p>
